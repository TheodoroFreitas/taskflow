<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);--accent:#2563eb;--accent-h:#3b82f6;
  --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;--danger:#ef4444;--success:#22c55e;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 10% 0%,rgba(37,99,235,0.14) 0%,transparent 55%),radial-gradient(ellipse 50% 40% at 90% 100%,rgba(37,99,235,0.08) 0%,transparent 55%);}
.login-center{position:relative;z-index:1;width:100%;max-width:400px;padding:24px;animation:fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px;}
.brand-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:36px;box-shadow:0 0 0 1px rgba(255,255,255,0.03) inset,0 20px 60px rgba(0,0,0,0.45);}
.login-card h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.3px;margin-bottom:6px;}
.login-card .sub{font-size:13px;color:var(--muted2);margin-bottom:24px;line-height:1.5;}
.hint{display:flex;align-items:center;gap:7px;padding:10px 14px;background:rgba(37,99,235,0.09);border:1px solid rgba(37,99,235,0.2);border-radius:10px;font-size:12px;color:#93c5fd;margin-bottom:20px;}
.err{display:none;align-items:center;gap:7px;padding:10px 14px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.22);border-radius:10px;font-size:13px;color:#fca5a5;margin-bottom:16px;}
.err.show{display:flex;}
.ff{margin-bottom:16px;}
.ff label{display:block;font-size:11px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;}
.ff input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;}
.ff input:focus{border-color:var(--accent);background:rgba(37,99,235,0.06);box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
.ff input::placeholder{color:rgba(100,116,139,0.6);}
.btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,0.35);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.login-footer{text-align:center;margin-top:18px;font-size:13px;color:var(--muted);}
.login-footer a{color:#93c5fd;text-decoration:none;font-weight:500;}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,0.05);padding:4px;border-radius:10px;}
.tab{flex:1;padding:8px;border:none;background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:7px;transition:all 0.15s;}
.tab.active{background:var(--accent);color:#fff;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="login-bg"></div>
<div class="login-center">
  <div class="login-brand">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="10" fill="#2563EB"/>
      <rect x="9" y="9" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
      <rect x="20" y="9" width="7" height="7" rx="2" fill="white" opacity="0.5"/>
      <rect x="9" y="20" width="7" height="7" rx="2" fill="white" opacity="0.5"/>
      <rect x="20" y="20" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
    </svg>
    <span class="brand-name">TaskFlow</span>
  </div>
  <div class="login-card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="setTab('login')">Entrar</button>
      <button class="tab" id="tabCadastro" onclick="setTab('cadastro')">Criar conta</button>
    </div>
    <div class="err" id="errBox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span id="errText"></span></div>
    <div class="ff"><label>Email</label><input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email"></div>
    <div class="ff" id="ffNome" style="display:none"><label>Nome</label><input type="text" id="nome" placeholder="Seu nome"></div>
    <div class="ff"><label>Senha</label><input type="password" id="senha" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" id="btnAcao" onclick="executar()">
      <span id="btnLabel">Entrar no TaskFlow</span>
    </button>
    <div class="login-footer" id="footerLink">
      Não tem conta? <a href="#" onclick="setTab('cadastro');return false;">Criar conta grátis</a>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyD-orSgwdJhKzDFpCCYYSi7Cp6uoR_GGC8",
  authDomain: "task-97699.firebaseapp.com",
  projectId: "task-97699",
  storageBucket: "task-97699.firebasestorage.app",
  messagingSenderId: "165802588673",
  appId: "1:165802588673:web:b34aef193a7df603279e00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Se já logado, vai direto pro painel
onAuthStateChanged(auth, user => {
  if (user) window.location.replace('./app.html?v=' + Date.now());
});

let modoAtual = 'login';

window.setTab = function(modo) {
  modoAtual = modo;
  document.getElementById('tabLogin').classList.toggle('active', modo === 'login');
  document.getElementById('tabCadastro').classList.toggle('active', modo === 'cadastro');
  document.getElementById('ffNome').style.display = modo === 'cadastro' ? 'block' : 'none';
  document.getElementById('btnLabel').textContent = modo === 'login' ? 'Entrar no TaskFlow' : 'Criar minha conta';
  document.getElementById('footerLink').style.display = modo === 'login' ? 'block' : 'none';
  document.getElementById('errBox').classList.remove('show');
};

window.executar = async function() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const nome  = document.getElementById('nome').value.trim();
  const btn   = document.getElementById('btnAcao');
  const lbl   = document.getElementById('btnLabel');

  if (!email || !senha) { mostrarErro('Preencha todos os campos.'); return; }
  if (modoAtual === 'cadastro' && !nome) { mostrarErro('Digite seu nome.'); return; }

  btn.disabled = true;
  lbl.innerHTML = '<div class="spinner"></div>';

  try {
    if (modoAtual === 'login') {
      await signInWithEmailAndPassword(auth, email, senha);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });
    }
    window.location.replace('./app.html?v=' + Date.now());
  } catch(e) {
    btn.disabled = false;
    lbl.textContent = modoAtual === 'login' ? 'Entrar no TaskFlow' : 'Criar minha conta';
    const msgs = {
      'auth/invalid-credential': 'Email ou senha inválidos.',
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/email-already-in-use': 'Este email já está cadastrado.',
      'auth/weak-password': 'Senha muito fraca. Use ao menos 6 caracteres.',
      'auth/invalid-email': 'Email inválido.',
      'auth/too-many-requests': 'Muitas tentativas. Tente novamente em alguns minutos.',
    };
    mostrarErro(msgs[e.code] || 'Erro: ' + e.message);
  }
};

function mostrarErro(msg) {
  document.getElementById('errText').textContent = msg;
  document.getElementById('errBox').classList.add('show');
}

// Enter para submeter
['email','senha','nome'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.executar();
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
